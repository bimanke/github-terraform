name: Terraform Workflow

on:
  push:
    branches:
      - master
      - 'feature/**'

permissions:
  contents: read

jobs:


  terraform-init-validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate



  security-scan:
    runs-on: ubuntu-latest

    needs: terraform-init-validate

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

   
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint

    
      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec
        run: tfsec .

     
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov -d . \
            --skip-check CKV_AZURE_178 \
            --skip-check CKV_AZURE_149 \
            --skip-check CKV_AZURE_1 \
            --skip-check CKV2_AZURE_31 \
            --skip-check CKV_AZURE_50 \
            --skip-check CKV2_GHA_1




  terraform-plan:
    runs-on: ubuntu-latest

    needs: security-scan

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }


      - name: Terraform Init
        run: terraform init

   

      - name: Terraform Plan
        run: terraform plan -out=tfplan

   

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: dev/tfplan




  plan-verification:
    runs-on: ubuntu-latest

    needs: terraform-plan

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

     
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: dev

    
      - name: Verify Terraform Plan
        run: |
          if [ ! -f tfplan ]; then
            echo "Terraform plan file not found"
            exit 1
          fi

          echo "Terraform plan artifact verified successfully"
          ls -lh tfplan



  manual-validation:
    runs-on: ubuntu-latest

    needs: plan-verification

    environment:
      name: production

    steps:

      - name: Production Approval
        run: echo "Production deployment approved"


  

  terraform-apply:
    runs-on: ubuntu-latest

    needs: manual-validation

    if: github.ref == 'refs/heads/master'

    defaults:
      run:
        working-directory: dev

    steps:


      - name: Checkout Code
        uses: actions/checkout@v4

    
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

    

      - name: Azure Login
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        run: terraform init

     
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: dev

     

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
