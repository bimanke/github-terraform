name: Terraform Workflow

on:
  push:
    branches:
      - master

# Required for Azure OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================
  # JOB 1 - TERRAFORM VALIDATE
  # ==========================================
  terraform-validate:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate


  # ==========================================
  # JOB 2 - TERRAFORM PLAN
  # ==========================================
  terraform-plan:

    runs-on: ubuntu-latest

    needs: terraform-validate

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan


  # ==========================================
  # JOB 3 - MANUAL VALIDATION
  # ==========================================
  manual-validation:

    runs-on: ubuntu-latest

    needs: terraform-plan

    environment:
      name: production

    steps:

      - name: Manual Approval Completed
        run: echo "Terraform Plan approved. Proceeding to Apply."


  # ==========================================
  # JOB 4 - TERRAFORM APPLY
  # ==========================================
  terraform-apply:

    runs-on: ubuntu-latest

    needs: manual-validation

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
