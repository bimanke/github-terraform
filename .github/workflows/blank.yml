name: Terraform Workflow

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1 - VALIDATE
  # ==========================================
  terraform-validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate


  # ==========================================
  # JOB 2 - PLAN
  # ==========================================
  terraform-plan:
    runs-on: ubuntu-latest

    needs: terraform-validate

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan


  # ==========================================
  # JOB 3 - MANUAL APPROVAL
  # ==========================================
  manual-validation:
    runs-on: ubuntu-latest

    needs: terraform-plan

    environment:
      name: production

    steps:

      - name: Approval
        run: echo "Production deployment approved"


  # ==========================================
  # JOB 4 - APPLY
  # ==========================================
  terraform-apply:
    runs-on: ubuntu-latest

    needs: manual-validation

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
