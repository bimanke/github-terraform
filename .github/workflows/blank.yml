name: Terraform Workflow

on:
  push:
    branches:
      - master
      - 'feature/**'

permissions:
  contents: read
  actions: read

jobs:

  # ==========================================================
  # JOB 1 - TERRAFORM CI
  # INIT + VALIDATE
  # ==========================================================

  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate


  # ==========================================================
  # JOB 2 - TERRAFORM SECURITY
  # TFLINT + TFSEC
  # ==========================================================

  terraform-security:
    name: Terraform Security
    runs-on: ubuntu-latest

    needs: terraform-ci

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # TFLINT
      # ------------------------------------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: dev
        run: |
          tflint --init
          tflint

      # ------------------------------------------------------
      # TFSEC
      # ------------------------------------------------------

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: dev


  # ==========================================================
  # JOB 3 - TERRAFORM PLAN
  # ==========================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    needs: terraform-ci

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        run: terraform init

      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # ------------------------------------------------------
      # Convert Plan to JSON
      # ------------------------------------------------------

      - name: Terraform Plan JSON
        run: terraform show -json tfplan > plan.json

      # ------------------------------------------------------
      # Upload Plan Artifact
      # ------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            dev/tfplan
            dev/plan.json


  # ==========================================================
  # JOB 4 - AGENTIC AI SECURITY
  # PYTHON DEPLOYMENT AGENT
  # ==========================================================

  agentic-ai-security:
    name: Agentic AI Security
    runs-on: ubuntu-latest

    needs:
      - terraform-security
      - terraform-plan

    permissions:
      contents: read
      actions: read

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Download Terraform Plan
      # ------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: dev

      # ------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ------------------------------------------------------
      # Install Agent Dependencies
      # ------------------------------------------------------

      - name: Install Agent Dependencies
        run: pip install -r agent/requirements.txt

      # ------------------------------------------------------
      # Run Python Deployment Agent
      # ------------------------------------------------------

      - name: Run Deployment Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEPLOYMENT_ENVIRONMENT: production
        run: python agent/agent.py


  # ==========================================================
  # JOB 5 - TERRAFORM APPLY
  # ==========================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: agentic-ai-security

    if: github.ref == 'refs/heads/master'

    permissions:
      contents: read

    defaults:
      run:
        working-directory: dev

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Terraform Setup
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        run: terraform init

      # ------------------------------------------------------
      # Download Exact Terraform Plan
      # ------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: dev

      # ------------------------------------------------------
      # Verify Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan
        run: |
          if [ ! -f tfplan ]; then
            echo "ERROR: tfplan not found"
            exit 1
          fi

          echo "Exact Terraform plan found."

      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
